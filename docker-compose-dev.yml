services:
  odoo-web-dev:
    build: .
    volumes:
      - ./odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./oca_addons:/mnt/oca-addons
    container_name: odoo-web-dev
    environment:
      - DB=${POSTGRES_DB}
      - HOST=${POSTGRES_HOST}
      - PORT=${POSTGRES_PORT}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD}
    # command: odoo --database=${POSTGRES_DB} --init=base
    networks:
      - pt2_backend_network_dev
    restart: unless-stopped

networks:
  pt2_backend_network_dev:
    external: true